<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disctreo API Server</title>
    <style>
        body {
            background-color: #15161a;
            color: #90a4ae;
            font-family: 'Consolas', monospace;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .card {
            background-color: #212229;
            padding: 40px 60px;
            border-radius: 8px;
            border: 1px solid #1de9b6;
            text-align: center;
            box-shadow: 0 4px 20px rgba(0,0,0,0.5);
        }
        h1 {
            color: #ffffff;
            margin-bottom: 5px;
            font-family: 'Segoe UI', sans-serif;
        }
        .status {
            color: #00e676;
            font-weight: bold;
            font-size: 1.2em;
            margin-top: 20px;
        }
        .accent {
            color: #1de9b6;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>DISCTREO <span class="accent">SERVER</span></h1>
        <p>Private Patching Node & Asset Delivery</p>
        <div class="status">● SYSTEM ONLINE</div>
        <p style="font-size: 0.8em; margin-top: 30px; opacity: 0.5;">Access restricted to Disctreo Client.</p>
    </div>
</body>
